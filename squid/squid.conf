# ============================================================
# Squid 白名单代理配置（容器内所有浏览器/脚本的全局代理）
# 作用：只放行下面列出的站点，其余网站全部拒绝
# 监听端口：3128
# ============================================================

# 常见安全端口
acl SSL_ports    port 443
acl Safe_ports   port 80        # http
acl Safe_ports   port 443       # https
acl Safe_ports   port 8080      # 备用 http
acl Safe_ports   port 3128      # squid 自身

# 本机回环
acl localhost    src 127.0.0.1/32 ::1
acl to_localhost dst 127.0.0.1/32 ::1

# ---------------- 白名单域名（按你的要求添加） ----------------
# 代码托管平台
acl whitelist    dstdomain .github.com .gitlab.com .gitea.io
# Python / Java 包源
acl whitelist    dstdomain .pypi.org .files.pythonhosted.org .maven.org
# 下载 / 应用市场
acl whitelist    dstdomain .apkpure.com
# 数据库官方
acl whitelist    dstdomain .postgresql.org .mysql.com .mongodb.com .redis.io
# 编程学习平台
acl whitelist    dstdomain .leetcode.com .codecademy.com .w3schools.com
# 容器自身更新用（apt 源，给系统装包用，可按需保留或删除）
acl whitelist    dstdomain .archive.ubuntu.com .security.ubuntu.com .ports.ubuntu.com

# HTTPS 需要 CONNECT 方法，同样按域名白名单放行
acl whitelist_connect dstdomain .github.com .gitlab.com .gitea.io \
                              .pypi.org .files.pythonhosted.org .maven.org \
                              .apkpure.com .postgresql.org .mysql.com .mongodb.com .redis.io \
                              .leetcode.com .codecademy.com .w3schools.com \
                              .archive.ubuntu.com .security.ubuntu.com .ports.ubuntu.com

# ---------------- 访问控制规则（顺序敏感） ----------------
http_access allow manager localhost
http_access deny  manager

# 只允许安全端口
http_access deny  !Safe_ports
# HTTPS 只允许 443
http_access deny  CONNECT !SSL_ports

# 本机访问放行
http_access allow localhost

# 白名单放行（HTTP 与 HTTPS）
http_access allow whitelist
http_access allow CONNECT whitelist_connect

# 其余一律拒绝
http_access deny all

# ---------------- 基本参数 ----------------
http_port 3128
cache_dir ufs /var/spool/squid 100 16 256
coredump_dir /var/spool/squid
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
visible_hostname container-agent
